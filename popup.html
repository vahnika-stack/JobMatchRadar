<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobMatch Radar</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#14202e" />
          <circle cx="16" cy="16" r="9" fill="none" stroke="#7f9cc9" stroke-width="1" />
          <circle cx="16" cy="16" r="4" fill="none" stroke="#7f9cc9" stroke-width="1" />
          <path d="M16 16 L27 9" stroke="#f2c14e" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="21.5" cy="12" r="1.7" fill="#2e7d4f" />
        </svg>
        <div>
          <h1>JobMatch Radar</h1>
          <p class="tagline">Your skills, read against the posting.</p>
        </div>
      </header>

      <section>
        <label for="skill-input">Add skills</label>
        <input
          id="skill-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="React, Node, SQL, AWS"
          aria-describedby="input-hint error"
        />
        <p id="input-hint" class="hint">Separate with commas or press Enter.</p>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <ul id="chips" class="chips" aria-label="Your skills"></ul>
      <p id="empty" class="empty">You haven't added any skills yet. Type below.</p>

      <footer class="footer">
        <p id="status" class="status" aria-live="polite"></p>
        <button id="clear" type="button" class="ghost">Clear all</button>
      </footer>
    </main>

    <script src="synonyms.js"></script>
    <script src="matcher.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
